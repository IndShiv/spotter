[project]
name = "spotter"
version = "0.1.0"
description = "Computer-vision rep counter for functional-fitness training."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.10.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
spotter = "spotter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spotter"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: typer.Option(...)/typer.Argument(...) in defaults is the required
# Typer pattern, not a real "mutable default" hazard.
ignore = ["B008"]
